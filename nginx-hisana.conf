# ==============================================================================
# HISANA FRIED CHICKEN - TEMPLATE KONFIGURASI NGINX UNTUK VPS
# Simpan file ini di VPS pada: /etc/nginx/sites-available/hisana
# Lalu aktifkan dengan:
#   sudo ln -s /etc/nginx/sites-available/hisana /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    server_name hisanacirebon.web.id www.hisanacirebon.web.id;

    # Batas ukuran upload berkas (CV, KTP, Surat Lamaran max 5MB)
    client_max_body_size 15M;

    # Semua request diteruskan ke Node.js Express di port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Header penting agar Express mengenali IP asli & protokol
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}

# ------------------------------------------------------------------------------
# PANDUAN MENGAKTIFKAN SSL HTTPS GRATIS DENGAN CERTBOT:
# Jalankan di terminal VPS:
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d hisanacirebon.web.id -d www.hisanacirebon.web.id
# Certbot akan otomatis mengonfigurasi blok HTTPS (port 443) & redirect dari HTTP.
# ------------------------------------------------------------------------------

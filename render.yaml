services:
  - type: web
    name: hisana-cirebon
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: FORCE_HTTPS
        value: "false"
      - key: ENABLE_STRICT_CSP
        value: "false"
